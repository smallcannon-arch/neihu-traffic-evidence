<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>內湖國小 交通安全教育訪評 電子佐證</title>
<style>
:root{--navy:#123a6b;--navy2:#0b2748;--bg:#f4f6f9;--ink:#111;--line:#c9d2de;--accent:#ffd23f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Microsoft JhengHei","PingFang TC","Heiti TC","Noto Sans TC",sans-serif;font-size:22px;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;cursor:pointer;border:0}
#top{position:fixed;left:0;right:0;top:0;height:84px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px;z-index:5}
#top button{min-height:62px;min-width:120px;padding:0 18px;border-radius:12px;font-size:24px;font-weight:700;background:#fff;color:var(--navy)}
#top button[disabled]{opacity:.35}
#title{flex:1;font-size:24px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
main{position:absolute;top:84px;left:0;right:0;bottom:0;overflow:auto;padding:18px}
.home h1{font-size:30px;margin:6px 0 4px;text-align:center}
.home p.sub{text-align:center;margin:0 0 18px;font-size:22px;color:#333}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.vol{min-height:170px;border-radius:18px;background:var(--navy);color:#fff;text-align:left;padding:20px 24px;display:flex;flex-direction:column;justify-content:center;gap:6px;box-shadow:0 3px 0 var(--navy2)}
.vol .k{font-size:26px;color:var(--accent);font-weight:700}
.vol .n{font-size:34px;font-weight:700}
.vol .m{font-size:22px}
.items{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.it{min-height:110px;border-radius:14px;background:#fff;border:3px solid var(--navy);color:var(--ink);text-align:left;padding:12px 18px;display:flex;align-items:center;gap:16px}
.it .c{font-size:32px;font-weight:800;color:var(--navy);min-width:110px}
.it .t{font-size:24px;font-weight:700;line-height:1.3}
.it .p{font-size:20px;color:#444;margin-top:4px}
.voltitle{font-size:28px;font-weight:700;margin:0 0 8px}
.desc{font-size:20px;line-height:1.5;color:#333;margin:0 0 14px;padding:10px 14px;background:#fff;border-left:6px solid var(--navy)}
.ghead{font-size:24px;font-weight:800;color:#fff;background:var(--navy);padding:8px 14px;border-radius:10px;margin:18px 0 10px}
/* 佐證頁 */
.viewer{position:absolute;top:84px;bottom:96px;left:0;right:0;display:flex;flex-direction:column;padding:8px 10px 6px;overflow:hidden;touch-action:pinch-zoom}
.cap{font-size:22px;font-weight:700;color:var(--navy);padding:2px 6px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.stage img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;box-shadow:0 0 0 1px var(--line),0 4px 14px rgba(0,0,0,.15);cursor:zoom-in}
.hint{text-align:center;font-size:20px;color:#555;padding-top:4px}
#bottom{position:fixed;left:0;right:0;bottom:0;height:96px;background:var(--navy);display:none;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;z-index:5}
#bottom button{min-height:70px;min-width:190px;border-radius:14px;font-size:28px;font-weight:800;background:var(--accent);color:#111}
#bottom button[disabled]{background:#7b8aa0;color:#d8dde5}
#pageno{color:#fff;font-size:28px;font-weight:700;text-align:center;flex:1}
#full{position:fixed;inset:0;background:#000;z-index:20;display:none;overflow:auto;touch-action:pinch-zoom}
#full img{display:block;width:100%;height:auto;cursor:zoom-out}
#full .close{position:fixed;top:12px;right:12px;min-height:62px;padding:0 22px;border-radius:12px;font-size:24px;font-weight:800;background:#fff;color:#111;z-index:21}
@media (max-width:700px){#top button{min-width:96px;font-size:22px;padding:0 10px}#bottom button{min-width:130px;font-size:24px}#pageno{font-size:22px}#title{font-size:20px}}
</style>
</head>
<body>
<div id="top"><button id="bHome">回首頁</button><button id="bUp">上一層</button><div id="title"></div></div>
<main id="main"></main>
<div id="bottom"><button id="bPrev">上一頁</button><div id="pageno"></div><button id="bNext">下一頁</button></div>
<div id="full"><button class="close" id="bClose">縮回</button><img id="fimg" alt=""></div>
<script src="data.js"></script>
<script>
const D = window.DATA || [];
const $ = id => document.getElementById(id);
let st = {view:'home', v:0, i:0, p:0};
function go(s){ st = Object.assign({}, st, s); render(); }
function findItem(code){ for(let v=0; v<D.length; v++) for(let i=0;i<D[v].items.length;i++) if(D[v].items[i].code===code) return [v,i]; return [0,0]; }
function render(){
  const m = $('main'); $('bottom').style.display='none'; m.className=''; m.style.display='block';
  const old = document.querySelector('.viewer'); if(old) old.remove();
  $('bHome').disabled = st.view==='home'; $('bUp').disabled = st.view==='home';
  if(st.view==='home'){
    $('title').textContent = '新竹市香山區內湖國民小學　115年度交通安全教育訪評　電子佐證';
    let h = '<div class="home"><h1>請選擇冊別</h1><p class="sub">紙本四冊為正式書面資料，本頁為輔助檢視</p><div class="grid">';
    D.forEach((v,k)=>{ const n=v.items.reduce((a,b)=>a+b.pages.length,0);
      h += `<button class="vol" data-v="${k}"><span class="k">${v.key}</span><span class="n">${v.name}（${v.pct}）</span><span class="m">${v.pct}　細項 ${v.items[0].code}～${v.items[v.items.length-1].code}（${v.items.length} 項）</span></button>`; });
    m.innerHTML = h + '</div></div>';
    m.querySelectorAll('.vol').forEach(b=>b.onclick=()=>go({view:'vol', v:+b.dataset.v}));
  } else if(st.view==='vol'){
    const v = D[st.v];
    $('title').textContent = `${v.key}　${v.name}（${v.pct}）`;
    let h = `<div class="voltitle">${v.key}　${v.name}（${v.pct}）：請選擇細項</div><div class="desc">${v.desc||''}</div>`;
    let g = null;
    v.items.forEach((it,k)=>{
      if(it.group!==g){ if(g!==null) h += '</div>'; g = it.group; h += `<div class="ghead">指標：${g}</div><div class="items">`; }
      h += `<button class="it" data-i="${k}"><span class="c">${it.code}</span><span><div class="t">${it.title}</div><div class="p">共 ${it.pages.length} 頁</div></span></button>`; });
    m.innerHTML = h + '</div>';
    m.querySelectorAll('.it').forEach(b=>b.onclick=()=>go({view:'item', i:+b.dataset.i, p:0}));
  } else {
    const v = D[st.v], it = v.items[st.i], pg = it.pages[st.p];
    m.style.display='none';
    $('title').textContent = `${it.code}　${it.group}｜${it.title}`;
    const vw = document.createElement('div'); vw.className='viewer';
    vw.innerHTML = `<div class="cap"></div><div class="stage"><img alt=""></div><div class="hint">點圖片可放大，再點一次縮回</div>`;
    document.body.appendChild(vw);
    vw.querySelector('.cap').textContent = pg.label;
    const img = vw.querySelector('img'); img.src = pg.src; img.onclick = openFull;
    $('bottom').style.display='flex';
    $('pageno').textContent = `第 ${st.p+1}／${it.pages.length} 頁`;
    $('bPrev').disabled = st.p===0; $('bNext').disabled = st.p===it.pages.length-1;
    if(st.p+1<it.pages.length){ const n=new Image(); n.src=it.pages[st.p+1].src; }
  }
  try{ history.replaceState(null,'', st.view==='home'?'#':(st.view==='vol'?'#v'+st.v:'#'+D[st.v].items[st.i].code+'/'+(st.p+1))); }catch(e){}
}
function openFull(){ const it=D[st.v].items[st.i]; $('fimg').src=it.pages[st.p].src; $('full').style.display='block'; $('full').scrollTop=0; }
function closeFull(){ $('full').style.display='none'; }
$('fimg').onclick = closeFull; $('bClose').onclick = closeFull;
$('bHome').onclick = ()=>{ closeFull(); go({view:'home'}); };
$('bUp').onclick = ()=>{ closeFull(); if(st.view==='item') go({view:'vol'}); else go({view:'home'}); };
$('bPrev').onclick = ()=>{ if(st.p>0) go({p:st.p-1}); };
$('bNext').onclick = ()=>{ const n=D[st.v].items[st.i].pages.length; if(st.p<n-1) go({p:st.p+1}); };
document.addEventListener('keydown', e=>{ if(st.view!=='item') return;
  if(e.key==='ArrowRight'||e.key==='PageDown') $('bNext').click();
  if(e.key==='ArrowLeft'||e.key==='PageUp') $('bPrev').click();
  if(e.key==='Escape') closeFull(); });
(function init(){
  const h = decodeURIComponent(location.hash.slice(1));
  if(/^v\d$/.test(h)) st={view:'vol', v:+h[1], i:0, p:0};
  else if(h){ const [code,p] = h.split('/'); const [v,i] = findItem(code); st={view:'item', v, i, p:Math.max(0,(+p||1)-1)}; }
  render();
})();
</script>
</body>
</html>
