<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>內湖國小 交通安全教育訪評 電子佐證</title>
<link rel="icon" href="logo.png">
<style>
:root{
  --ink:#2E3A55; --ink2:#3d4a68; --paper:#FBF8F4; --line:#d9d2c8; --load:#EFEAE3;
  --v1:#F4C2CC; --v1d:#d99aa8; --v2:#BFE3D0; --v2d:#8fc4a8; --v3:#BCD9F0; --v3d:#8db8db; --v4:#D5CCEE; --v4d:#ada0d6;
  --apr:#F9D3B4; --aprd:#e5ac80;
  --gut:max(24px,env(safe-area-inset-left));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",sans-serif;font-size:22px;line-height:1.5;
  -webkit-text-size-adjust:100%}
::selection{background:var(--apr);color:var(--ink)}
html{scrollbar-color:var(--aprd) var(--paper)}
button,a.btn{font:inherit;color:var(--ink);cursor:pointer;border:2px solid var(--aprd);background:var(--apr);
  min-height:64px;padding:0 22px;border-radius:14px;font-size:24px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;white-space:nowrap}
button:focus-visible,a:focus-visible,.th:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
button:active{transform:translateY(1px)}
button[disabled]{opacity:.4;cursor:default}
svg.ic{width:26px;height:26px;flex:none;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1280px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gut)}

/* 頁首 */
header.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:2px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-top:10px;padding-bottom:10px}
header.top img{width:60px;height:60px;flex:none}
header.top h1{margin:0;font-size:30px;font-weight:800;flex:1;min-width:0;line-height:1.25}
header.top h1 small{display:block;font-size:22px;font-weight:600;color:var(--ink2);word-break:keep-all}
header.top h1 small span{display:inline-block;margin-right:.8em}

/* 首頁 */
.intro{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding-top:22px;padding-bottom:22px}
.intro p{margin:0;font-size:22px;color:var(--ink)}
section.band{padding:22px 0 26px}
section.band + section.band{border-top:2px solid var(--paper)}
.band h2{margin:0 0 16px;font-size:28px;font-weight:800;line-height:1.3;word-break:keep-all}
.band h2 span{display:inline-block;margin-right:.6em}
.band h2 .p{font-weight:600;font-size:24px}
.vol1{background:var(--v1)} .vol2{background:var(--v2)} .vol3{background:var(--v3)} .vol4{background:var(--v4)}
.items{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr))}
.it{flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:left;white-space:normal;
  min-height:132px;padding:14px 16px;background:var(--paper);border:2px solid transparent;border-radius:14px;gap:4px}
.vol1 .it{border-color:var(--v1d)} .vol2 .it{border-color:var(--v2d)} .vol3 .it{border-color:var(--v3d)} .vol4 .it{border-color:var(--v4d)}
.it .c{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.it .t{font-size:24px;font-weight:700;line-height:1.35;word-break:keep-all}
.it .t span{display:inline-block}
.it .n{font-size:22px;font-weight:500;color:var(--ink2);margin-top:auto}

/* 細項：縮圖格 */
.ihead h2{margin:0;font-size:30px;font-weight:800;line-height:1.3;word-break:keep-all}
.ihead h2 span{display:inline-block}
.ihead p{margin:6px 0 0;font-size:22px}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));padding-top:24px;padding-bottom:48px}
.th{cursor:pointer;display:flex;flex-direction:column;gap:8px;position:relative;border-radius:6px}
.th .im{position:relative;aspect-ratio:1400/1982;background:var(--load);border:2px solid var(--line);border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:22px;color:var(--ink)}
.th .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;background:#fff;opacity:0}
.th .im.ok img{opacity:1}
.th .pg{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.th .lb{font-size:22px;color:var(--ink2);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.th .eo{position:absolute;top:8px;right:8px;z-index:1;background:var(--apr);border:2px solid var(--aprd);color:var(--ink);font-size:22px;font-weight:800;padding:2px 10px;border-radius:8px}

/* 放大檢視 */
#viewer{position:fixed;inset:0;z-index:20;background:#e9e4dc;display:none;flex-direction:column}
#viewer.on{display:flex}
#vbar,#vfoot{display:flex;align-items:center;gap:10px;padding:6px max(12px,env(safe-area-inset-right)) 6px max(12px,env(safe-area-inset-left));background:var(--paper)}
#vbar{border-bottom:2px solid var(--line)}
#vfoot{border-top:2px solid var(--line);justify-content:space-between;padding-bottom:max(6px,env(safe-area-inset-bottom))}
#vcap{flex:1;min-width:0;font-size:22px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vcap b{font-size:24px;margin-right:.6em}
#vstage{flex:1;overflow:auto;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;position:relative}
#vimg{display:block;margin:0 auto;background:#fff;box-shadow:0 2px 12px rgba(46,58,85,.18);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#vstate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-size:24px;color:var(--ink);text-align:center;padding:20px}
#vstate .box{background:var(--load);border:2px solid var(--line);border-radius:14px;padding:28px 36px}
#vpos{white-space:nowrap;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;min-width:110px;text-align:center}
.zgrp{display:flex;gap:10px;align-items:center}

@media (max-width:1000px){ .items{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:760px){
  .items{grid-template-columns:repeat(2,minmax(0,1fr))}
  #vfoot .tx{display:none} #vfoot button{padding:0 14px;min-width:64px}
}
@media (max-width:560px){
  :root{--gut:16px}
  header.top img{width:48px;height:48px} header.top h1{font-size:24px} header.top h1 small{font-size:20px}
  .items{grid-template-columns:1fr}
  .it{flex-direction:row;align-items:center;min-height:84px;gap:14px}
  .it .c{min-width:68px;font-size:24px} .it .n{margin-top:0}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  #vbar .tx{display:none} #vbar button{padding:0 14px}
  #vcap b{display:block;margin:0} #vcap{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  #vfoot{gap:4px} #vfoot button{padding:0 10px;min-width:56px} .zgrp{gap:4px} #vFitTx{display:none} #vpos{min-width:0;font-size:24px}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <img src="logo.png" alt="內湖國小校徽">
  <h1>新竹市香山區內湖國民小學<small><span>115年度交通安全教育訪評</span><span>電子佐證</span></small></h1>
  <button id="bHomeTop" hidden><svg class="ic" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>回首頁</button>
</div></header>
<main id="main"></main>

<div id="viewer" role="dialog" aria-modal="true" aria-labelledby="vcap">
  <div id="vbar">
    <div id="vcap"></div>
    <button id="vItem"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg><span class="tx">回細項</span></button>
    <button id="vHome"><svg class="ic" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span class="tx">回首頁</span></button>
  </div>
  <div id="vstage"><img id="vimg" alt=""><div id="vstate"></div></div>
  <div id="vfoot">
    <button id="vPrev" aria-label="上一頁"><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span class="tx">上一頁</span></button>
    <button id="vFit" aria-pressed="false" aria-label="填滿寬度"><svg class="ic" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span id="vFitTx">填滿寬度</span></button>
    <div class="zgrp">
      <button id="vOut" aria-label="縮小"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M16.5 16.5L21 21"/></svg><span class="tx">縮小</span></button>
      <div id="vpos"></div>
      <button id="vIn" aria-label="放大"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6M16.5 16.5L21 21"/></svg><span class="tx">放大</span></button>
    </div>
    <button id="vNext" aria-label="下一頁"><span class="tx">下一頁</span><svg class="ic" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</div>

<script src="data.js"></script>
<script>
const D = window.DATA || [];
const TRAFFIC = 'https://nhps-traffic.nhps.workers.dev/';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ITEMS = {};
D.forEach((v, vi) => v.items.forEach(it => { ITEMS[it.code] = {v, vi, it}; }));
const pageNo = p => p.paper || '紙本未收錄';
const parts = it => (it.title_parts || [it.title]).map(s => `<span>${esc(s)}</span>`).join('');
let homeY = 0, view_ = 'home';

function home(){
  $('bHomeTop').hidden = true;
  let h = `<div class="wrap intro"><p>紙本四冊為正式書面資料，本頁供委員檢視；請點選細項。</p>
    <a class="btn" href="${TRAFFIC}" target="_blank" rel="noopener"><svg class="ic" viewBox="0 0 24 24"><path d="M5 19c3-1 3-6 7-7s4-6 7-7"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/></svg>通學動線動態圖</a></div>`;
  D.forEach((v, vi) => {
    h += `<section class="band vol${vi+1}"><div class="wrap"><h2><span>${esc(v.key)}</span><span>${esc(v.name)}</span><span class="p">${esc(v.pct)}</span></h2><div class="items">`;
    v.items.forEach(it => {
      h += `<button class="it" data-code="${esc(it.code)}"><span class="c">${esc(it.code)}</span><span><span class="t">${parts(it)}</span><span class="n" style="display:block">${it.pages.length} 頁</span></span></button>`;
    });
    h += '</div></div></section>';
  });
  $('main').innerHTML = h;
  document.querySelectorAll('.it').forEach(b => b.onclick = () => { homeY = window.scrollY; go('#/' + b.dataset.code); });
  document.title = '內湖國小 交通安全教育訪評 電子佐證';
}

function thumbLoad(el){
  const box = el.querySelector('.im'), img = box.querySelector('img'), msg = box.querySelector('.ms');
  img.onload = () => { box.classList.add('ok'); msg.hidden = true; };
  img.onerror = () => { msg.textContent = '這一頁載入失敗，請按重新整理'; };
  img.src = img.dataset.src;
}
function item(code){
  const x = ITEMS[code]; if(!x) return home();
  $('bHomeTop').hidden = false;
  const {v, vi, it} = x;
  let h = `<section class="band ihead vol${vi+1}"><div class="wrap"><h2>${esc(it.code)}　${esc(it.title)}</h2><p>${esc(v.key)}　${esc(v.name)}　｜　指標：${esc(it.group)}　｜　共 ${it.pages.length} 頁</p></div></section><div class="wrap grid">`;
  it.pages.forEach((p, i) => {
    h += `<div class="th" role="button" tabindex="0" data-i="${i}" title="${esc(pageNo(p) + '　' + p.label)}"><div class="im"><span class="ms">載入中</span><img loading="lazy" data-src="${esc(p.thumb)}" alt=""></div>${p.paper ? '' : '<span class="eo">僅電子</span>'}<span class="pg">${esc(pageNo(p))}</span><span class="lb">${esc(p.label)}</span></div>`;
  });
  $('main').innerHTML = h + '</div>';
  document.querySelectorAll('.th').forEach(b => {
    thumbLoad(b);
    b.onclick = () => go(`#/${code}/${+b.dataset.i + 1}`);
    b.onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); b.click(); } };
  });
  document.title = `${it.code} ${it.title}｜電子佐證`;
}

/* 放大檢視：mode 'page' 整頁、'width' 填滿寬度；scale 由該模式的基準寬度起算 */
let cur = null, scale = 1, mode = 'page';
function baseWidth(){
  const st = $('vstage'), img = $('vimg');
  const nw = img.naturalWidth || 1400, nh = img.naturalHeight || 1982;
  const fw = (st.clientWidth - 16) / nw;
  return nw * (mode === 'width' ? fw : Math.min(fw, (st.clientHeight - 16) / nh));
}
function applyScale(rx, ry){
  const st = $('vstage'), img = $('vimg');
  const oldW = img.offsetWidth || 1, w = baseWidth() * scale;
  rx = rx == null ? .5 : rx; ry = ry == null ? .5 : ry;
  const cx = st.scrollLeft + st.clientWidth * rx, cy = st.scrollTop + st.clientHeight * ry;
  img.style.width = w + 'px';
  img.style.marginTop = (mode === 'page' && scale === 1) ? Math.max(8, (st.clientHeight - img.offsetHeight) / 2) + 'px' : '8px';
  img.style.marginBottom = '8px';
  const k = w / oldW;
  st.scrollLeft = cx * k - st.clientWidth * rx; st.scrollTop = cy * k - st.clientHeight * ry;
  $('vOut').disabled = scale <= 1; $('vIn').disabled = scale >= 4;
}
function zoom(f, rx, ry){ scale = Math.min(4, Math.max(1, scale * f)); applyScale(rx, ry); }
function setMode(m){
  mode = m; scale = 1;
  $('vFit').setAttribute('aria-pressed', m === 'width'); $('vFitTx').textContent = m === 'width' ? '整頁' : '填滿寬度'; $('vFit').setAttribute('aria-label', $('vFitTx').textContent);
  applyScale(.5, 0); $('vstage').scrollTop = 0;
}
function stateMsg(kind){
  const s = $('vstate');
  if(!kind){ s.hidden = true; s.innerHTML = ''; return; }
  s.hidden = false;
  s.innerHTML = kind === 'load' ? '<div class="box">載入中</div>'
    : '<div class="box">這一頁載入失敗，請按重新整理</div><button id="vRetry">重試</button>';
  if(kind === 'err') $('vRetry').onclick = () => view(cur.code, cur.i + 1, true);
}
function view(code, n, retry){
  const x = ITEMS[code]; if(!x) return home();
  if($('main').dataset.code !== code){ item(code); $('main').dataset.code = code; }
  const it = x.it, i = Math.min(Math.max(n - 1, 0), it.pages.length - 1), p = it.pages[i];
  cur = {code, i, it};
  $('vcap').innerHTML = `<b>${esc(it.code)}　${esc(it.title)}</b>${esc(pageNo(p))}　${esc(p.label)}`;
  $('vcap').title = `${it.code} ${it.title}　${pageNo(p)}　${p.label}`;
  $('vpos').textContent = `${i + 1} / ${it.pages.length}`;
  $('vPrev').disabled = i === 0; $('vNext').disabled = i === it.pages.length - 1;
  const img = $('vimg'); scale = 1;
  img.style.visibility = 'hidden'; stateMsg('load');
  img.onload = () => { stateMsg(null); img.style.visibility = ''; applyScale(.5, 0); $('vstage').scrollTop = 0; };
  img.onerror = () => { stateMsg('err'); };
  img.removeAttribute('src');
  img.src = retry ? p.src + '?r=' + Date.now() : p.src; img.alt = p.label;
  $('viewer').classList.add('on'); document.body.style.overflow = 'hidden';
  [i - 1, i + 1].forEach(k => { if(k >= 0 && k < it.pages.length) new Image().src = it.pages[k].src; });
}
function closeViewer(){ $('viewer').classList.remove('on'); document.body.style.overflow = ''; cur = null; }

function go(h){ if(location.hash === h) route(); else location.hash = h; }
function route(){
  const m = decodeURIComponent(location.hash).match(/^#\/([\d-]+)(?:\/(\d+))?$/);
  if(!m){ closeViewer(); $('main').dataset.code = ''; home(); window.scrollTo(0, homeY); view_ = 'home'; return; }
  if(m[2]){ view(m[1], +m[2]); view_ = 'view'; return; }
  const back = $('main').dataset.code === m[1];
  closeViewer();
  if(!back){ item(m[1]); $('main').dataset.code = m[1]; window.scrollTo(0, 0); }
  view_ = 'item';
}
window.addEventListener('hashchange', route);
window.addEventListener('resize', () => { if(cur) applyScale(); });
$('bHomeTop').onclick = () => go('#/');
$('vHome').onclick = () => go('#/');
$('vItem').onclick = () => go('#/' + cur.code);
$('vPrev').onclick = () => cur && cur.i > 0 && go(`#/${cur.code}/${cur.i}`);
$('vNext').onclick = () => cur && cur.i < cur.it.pages.length - 1 && go(`#/${cur.code}/${cur.i + 2}`);
$('vIn').onclick = () => zoom(1.5);
$('vOut').onclick = () => zoom(1 / 1.5);
$('vFit').onclick = () => setMode(mode === 'page' ? 'width' : 'page');
$('vimg').ondblclick = e => { const st = $('vstage'), r = st.getBoundingClientRect(); scale > 1 ? zoom(1 / scale) : zoom(2, (e.clientX - r.left) / st.clientWidth, (e.clientY - r.top) / st.clientHeight); };
document.addEventListener('keydown', e => {
  if(!cur) return;
  if(e.key === 'ArrowRight' || e.key === 'PageDown') $('vNext').click();
  else if(e.key === 'ArrowLeft' || e.key === 'PageUp') $('vPrev').click();
  else if(e.key === '+' || e.key === '=') zoom(1.5);
  else if(e.key === '-') zoom(1 / 1.5);
  else if(e.key === 'Escape') $('vItem').click();
});
/* 雙指縮放（iPad／手機） */
(function(){
  const st = $('vstage'); let d0 = 0, s0 = 1;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  st.addEventListener('touchstart', e => { if(e.touches.length === 2){ d0 = dist(e.touches); s0 = scale; } }, {passive: true});
  st.addEventListener('touchmove', e => {
    if(e.touches.length !== 2 || !d0) return;
    e.preventDefault();
    const r = st.getBoundingClientRect();
    const mx = ((e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left) / st.clientWidth;
    const my = ((e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top) / st.clientHeight;
    scale = Math.min(4, Math.max(1, s0 * dist(e.touches) / d0)); applyScale(mx, my);
  }, {passive: false});
  st.addEventListener('touchend', e => { if(e.touches.length < 2) d0 = 0; });
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
})();
route();
</script>
</body>
</html>
